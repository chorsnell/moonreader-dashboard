name: deploy
# Builds the image, pushes it to ghcr.io/chorsnell/moonreader-dashboard and deploys it
# to the homelab, using the shared workflow in chorsnell/workflows. Runs after the test
# workflow passes on main, or by hand from the Actions tab.
#
# Needs these repository secrets (passed through by `secrets: inherit`):
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET  Tailscale OAuth client (tag:ci)
#   DEPLOY_SSH_KEY                       private key for deploy@docker-host
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    uses: chorsnell/workflows/.github/workflows/deploy.yml@main
    with:
      app: moonreader-dashboard
    secrets: inherit
