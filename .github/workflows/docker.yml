name: docker
# Once the tests pass on main, builds the image, pushes it to ghcr.io and tells the server
# to pull it (a signed POST to the deploy hook, see deploy/hook.mjs). The server never
# polls. The deploy step is skipped until the DEPLOY_URL and DEPLOY_SECRET secrets exist.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_COMMIT=${{ env.SHA }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tell the server to pull it
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_SECRET" ]; then
            echo "DEPLOY_URL / DEPLOY_SECRET not set; skipping the deploy"
            exit 0
          fi
          body=$(printf '{"sha":"%s","ts":%s}' "$SHA" "$(date +%s)")
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | sed 's/^.* //')
          curl --fail-with-body --silent --show-error --max-time 20 --retry 3 --retry-all-errors \
            -H 'content-type: application/json' -H "x-signature: sha256=$sig" \
            --data "$body" "$DEPLOY_URL"
