name: test
on:
  # Branch pushes are covered by their PR; only main runs on push.
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint and type-check
        run: npm run lint && npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: End-to-end tests
        run: npm run test:e2e
