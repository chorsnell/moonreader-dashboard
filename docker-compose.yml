services:
  moonreader-dashboard:
    build:
      context: .
      args:
        # shown in the page's footer: GIT_COMMIT=$(git rev-parse HEAD) docker compose build
        GIT_COMMIT: ${GIT_COMMIT:-}
    # IMAGE=ghcr.io/chorsnell/moonreader-dashboard:latest in .env runs the image CI builds
    # instead (docker compose pull && docker compose up -d), which the deploy hook below needs
    image: ${IMAGE:-moonreader-dashboard}
    container_name: moonreader-dashboard
    restart: unless-stopped
    ports:
      - "9080:8080"              # change the left number to use another port
    environment:
      TZ: Europe/London
      PUID: 1000                 # owner of the files in ./library on the host
      PGID: 1000
      # The admin password: sign in with it (the "Admin" link) to upload, and use it for
      # WebDAV sync. Whether visitors need a read password is set from the dashboard.
      # Set it in .env (copy .env.example), so the secret stays out of this file.
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
      # Only needed if your reverse proxy forwards /reading/... WITHOUT stripping the
      # prefix. With Traefik's stripPrefix (see examples/traefik.yml) leave it empty.
      BASE_PATH: ""
      # Covers missing from the backup are looked up on openlibrary.org. "off" stops that.
      COVER_LOOKUP: "on"
      # Publication years, page counts and author countries/genders from Open Library and
      # wikidata.org. "off" stops that.
      METADATA_LOOKUP: "on"
      # How often to check library/inbox/ (seconds) and how many backups to keep.
      POLL_SECONDS: 30
      KEEP_BACKUPS: 5
      # TV, film and audiobooks (all optional; they can also be set on the admin page).
      # The keys live in .env with UPLOAD_TOKEN.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TAUTULLI_URL: ${TAUTULLI_URL:-}
      TAUTULLI_API_KEY: ${TAUTULLI_API_KEY:-}
      AUDIOBOOKSHELF_URL: ${AUDIOBOOKSHELF_URL:-}
      AUDIOBOOKSHELF_TOKEN: ${AUDIOBOOKSHELF_TOKEN:-}
      MIXPANEL_TOKEN: ${MIXPANEL_TOKEN:-}
      MIXPANEL_API_HOST: ${MIXPANEL_API_HOST:-}
      MEDIA_POLL_MINUTES: 60
      # How often to refresh friends' dashboards you follow, in minutes (0: only by hand).
      FEDERATION_REFRESH_MINUTES: 60
      # Every other setting is in the README's Settings table.
    volumes:
      - ./library:/library       # everything the app keeps: backups, data, covers, settings

  # Optional: pulls the new image and restarts the dashboard when GitHub Actions says so
  # after a push to main (no polling). Off unless started with --profile deploy; set
  # DEPLOY_SECRET and DEPLOY_DIR in .env first. See "Deploy on push" in the README.
  deploy-hook:
    profiles: [deploy]
    build: ./deploy
    container_name: moonreader-deploy-hook
    restart: unless-stopped
    ports:
      - "9081:9000"
    environment:
      DEPLOY_SECRET: ${DEPLOY_SECRET:-}
      DEPLOY_DIR: ${DEPLOY_DIR:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # mounted at the same path as on the host, so ./library in this file still means
      # the host's folder when the hook runs docker compose
      - ${DEPLOY_DIR:-./deploy}:${DEPLOY_DIR:-/unset}
